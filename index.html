<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Streaming Pro - Versión Estable</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- ✅ Solución para favicon 404 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" sizes="any">
    <link rel="shortcut icon" type="image/ico" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #ec4899;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b;
            --dark-border: #334155;
            --light-bg: #f8fafc;
            --light-surface: #ffffff;
            --light-border: #e2e8f0;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }
        /* ✅ Tema claro más suave */
        body.light-mode {
            --dark-bg: #f1f5f9;
            --dark-surface: #ffffff;
            --dark-border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.1;
            z-index: -1;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        body.light-mode .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .header {
            position: relative;
            padding: 2rem 0;
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .time-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .clock-widget {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1rem 2rem;
            border-radius: 50px;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .player-section {
            position: relative;
            overflow: hidden;
        }
        .player-content {
            position: relative;
            z-index: 2;
            padding: 2rem;
        }
        .station-selector select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--dark-border);
            border-radius: 15px;
            background: var(--dark-surface);
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        body.light-mode .station-selector select {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .current-station {
            text-align: center;
            margin-bottom: 2rem;
        }
        .station-logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            margin: 0 auto 1.5rem;
            display: block;
        }
        .station-logo.playing {
            animation: rotate-logo 10s linear infinite;
        }
        @keyframes rotate-logo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .station-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .station-country {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
        .control-btn.play-pause {
            width: 80px;
            height: 80px;
            font-size: 2rem;
        }
        .control-btn.favorite {
            background: linear-gradient(135deg, var(--danger-color), var(--warning-color));
        }
        .control-btn.favorite.active {
            background: linear-gradient(135deg, var(--warning-color), var(--success-color));
        }
        .volume-control {
            margin-bottom: 2rem;
        }
        .volume-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .volume-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--dark-border);
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        body.light-mode .volume-slider {
            background: var(--light-border);
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .section {
            padding: 2rem;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-title i {
            color: var(--primary-color);
        }
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .station-list::-webkit-scrollbar {
            width: 6px;
        }
        .station-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .station-list::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }
        .station-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .station-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-color);
            transform: translateX(5px);
        }
        .station-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }
        .station-item-info {
            flex: 1;
        }
        .station-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .station-item-country {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .action-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 150px;
        }
        .whatsapp-btn {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
        }
        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }
        .notification-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }
        .notification-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4);
        }
        @media (max-width: 768px) {
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
        .notification {
            position: fixed;
            top: 8rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
            font-weight: 600;
            max-width: 90%;
            text-align: center;
        }
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .stream-error {
            position: fixed;
            top: 12rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--danger-color), var(--warning-color));
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3);
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
            font-weight: 600;
            max-width: 90%;
            text-align: center;
        }
        .stream-error.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @media (max-width: 768px) {
            .notification {
                top: 6rem;
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
            .stream-error {
                top: 10rem;
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            .controls {
                gap: 0.5rem;
            }
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .control-btn.play-pause {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-btn {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
        <header class="header">
            <h1><i class="fas fa-broadcast-tower"></i> Radio Streaming Pro</h1>
            <div class="time-display">
                <span id="greeting">Buenos días</span>
                <div class="clock-widget" id="clock">
                    <i class="fas fa-clock"></i> <span id="clock-time">12:00:00 PM</span>
                </div>
            </div>
        </header>
        <div class="main-grid">
            <div class="player-section glass">
                <div class="player-content">
                    <div class="station-selector">
                        <select id="stationSelect" onchange="changeStation(this.value)">
                            <option value="">Selecciona una emisora...</option>
                        </select>
                    </div>
                    <div class="current-station">
                        <img id="currentLogo" src="https://picsum.photos/seed/radio1/150/150.jpg" alt="Logo" class="station-logo">
                        <div class="station-name" id="currentName">Selecciona una emisora</div>
                        <div class="station-country" id="currentCountry">Costa Rica</div>
                        <div class="controls">
                            <button class="control-btn" onclick="previousStation()" title="Anterior">
                                <i class="fas fa-step-backward"></i>
                            </button>
                            <button class="control-btn play-pause" id="playPauseBtn" onclick="togglePlayPause()" title="Reproducir/Pausar">
                                <i class="fas fa-play" id="playIcon"></i>
                            </button>
                            <button class="control-btn" onclick="nextStation()" title="Siguiente">
                                <i class="fas fa-step-forward"></i>
                            </button>
                            <button class="control-btn favorite" id="favoriteBtn" onclick="toggleFavorite()" title="Favorito">
                                <i class="fas fa-heart" id="favoriteIcon"></i>
                            </button>
                        </div>
                        <div class="volume-control">
                            <div class="volume-label">
                                <span><i class="fas fa-volume-up"></i> Volumen</span>
                                <span id="volumeValue">70%</span>
                            </div>
                            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.1" value="0.7" onchange="changeVolume(this.value)">
                        </div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value" id="listenerCount">0</div>
                                <div class="stat-label">Oyentes</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="totalStations">32</div>
                                <div class="stat-label">Emisoras</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="favoriteCount">0</div>
                                <div class="stat-label">Favoritos</div>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <button class="action-btn whatsapp-btn" onclick="shareOnWhatsApp()">
                                <i class="fab fa-whatsapp"></i> Compartir
                            </button>
                            <button class="action-btn notification-btn" onclick="requestNotificationPermission()">
                                <i class="fas fa-bell"></i> Notificaciones
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="sidebar">
                <div class="section glass">
                    <h3 class="section-title">
                        <i class="fas fa-star"></i> Favoritos
                    </h3>
                    <div class="station-list" id="favoritesList">
                        <div style="text-align: center; opacity: 0.7; padding: 2rem;">
                            <i class="fas fa-heart" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                            No tienes favoritos aún
                        </div>
                    </div>
                </div>
                <div class="section glass">
                    <h3 class="section-title">
                        <i class="fas fa-history"></i> Recientes
                    </h3>
                    <div class="station-list" id="recentList">
                        <div style="text-align: center; opacity: 0.7; padding: 2rem;">
                            <i class="fas fa-clock" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                            No hay emisoras recientes
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <audio id="audioPlayer" preload="metadata"></audio>
    <div id="notification" class="notification">
        <i class="fas fa-info-circle"></i> <span id="notificationText"></span>
    </div>
    <div id="streamError" class="stream-error">
        <i class="fas fa-exclamation-triangle"></i> <span id="streamErrorText"></span>
    </div>

            { id: '25', name: 'Radio La Tuani en vivo', url: 'http://server.multimediamb.com/9300/stream', logo: 'https://static.mytuner.mobi/media/tvos_radios/KArdnuqZLu.png', country: 'Nicaragua' },
            { id: '26', name: 'Siuna La Poderosa', url: 'https://polaris.hostingnica.net/8012/stream/1/', logo: 'https://cdn-profiles.tunein.com/s239858/images/logod.png', country: 'Nicaragua' },
            { id: '27', name: 'Radio Bonanza', url: 'https://stream.zeno.fm/hj27louo82ptv', logo: 'https://cdn.instant.audio/images/logos/radios-co-ni/bonanza.png', country: 'Nicaragua' },
            { id: '28', name: 'Omega Stereo Panamá', url: 'https://www.streaming507.net:8048/stream', logo: 'https://radios-panama.com/uploads/img/omega-stereo.jpg', country: 'Panamá' },
            { id: '29', name: 'Actualidad 90.3 FM', url: 'https://acp4.lorini.net/proxy/ur2080?mp=/stream', logo: 'https://liveonlineradio.net/wp-content/uploads/2015/03/Actualidad-90.3-FM.jpg', country: 'Venezuela' },
            { id: '30', name: 'Caracol Radio 100.9 FM', url: 'https://27373.live.streamtheworld.com/CARACOL_RADIOAAC.aac?dist=onlineradiobox', logo: 'https://cdn.onlineradiobox.com/img/l/0/21440.v18.png', country: 'Venezuela' },
            { id: '31', name: 'Radio La Voz de Carabobo 1040 AM', url: 'https://guri.tepuyserver.net/8086/stream', logo: 'https://cdn.onlineradiobox.com/img/l/7/120377.v1.png', country: 'Venezuela' },
            { id: '32', name: '34 Tamá Stereo 103.9 FM / San Cristóbal', url: 'https://guri.tepuyserver.net/8457/stream;', logo: 'https://cdn.onlineradiobox.com/img/l/2/60312.v9.png', country: 'Venezuela' }
        ];

        let currentStation = null;
        let isPlaying = false;
        let volume = 0.7;
        let darkMode = true;
        let favorites = [];
        let recentStations = [];
        let listenerCount = 0;

        const audioPlayer = document.getElementById('audioPlayer');
        const stationSelect = document.getElementById('stationSelect');
        const currentLogo = document.getElementById('currentLogo');
        const currentName = document.getElementById('currentName');
        const currentCountry = document.getElementById('currentCountry');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const favoriteBtn = document.getElementById('favoriteBtn');
        const favoriteIcon = document.getElementById('favoriteIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const listenerCountEl = document.getElementById('listenerCount');
        const favoriteCountEl = document.getElementById('favoriteCount');
        const favoritesList = document.getElementById('favoritesList');
        const recentList = document.getElementById('recentList');
        const clockTime = document.getElementById('clock-time');
        const greeting = document.getElementById('greeting');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');
        const streamError = document.getElementById('streamError');
        const streamErrorText = document.getElementById('streamErrorText');

        function initApp() {
            console.log('✅ ¡Hola Óscar! App de radio ESTABLE y FUNCIONAL.');
            loadPreferences();
            populateStationSelector();
            setupAudioPlayer();
            updateClock();
            setInterval(updateClock, 1000);
            updateListenerCount();
            setInterval(updateListenerCount, 30000);
            setupKeyboardControls();
            
            // ✅ Cargar "Unción 106.7 FM" al iniciar (sin reproducir)
            const uncionStation = stations.find(s => s.name === "Unción 106.7 FM");
            if (uncionStation) {
                currentStation = uncionStation;
                currentLogo.src = uncionStation.logo;
                currentName.textContent = uncionStation.name;
                currentCountry.textContent = uncionStation.country;
                stationSelect.value = uncionStation.id;
                audioPlayer.src = uncionStation.url; // Solo carga la URL, no reproduce
                updateFavoriteButton();
                showNotification('📻 ¡Listo! Presiona, Enter o ▶');
            }
        }

        function loadPreferences() {
            const savedDarkMode = localStorage.getItem('darkMode');
            const savedFavorites = localStorage.getItem('favorites');
            const savedRecentStations = localStorage.getItem('recentStations');
            const savedVolume = localStorage.getItem('volume');
            if (savedDarkMode !== null) {
                darkMode = savedDarkMode === 'true';
                updateTheme();
            }
            if (savedFavorites) {
                favorites = JSON.parse(savedFavorites);
                updateFavoritesList();
                updateFavoriteCount();
            }
            if (savedRecentStations) {
                recentStations = JSON.parse(savedRecentStations);
                updateRecentList();
            }
            if (savedVolume) {
                volume = parseFloat(savedVolume);
                volumeSlider.value = volume;
                volumeValue.textContent = Math.round(volume * 100) + '%';
                audioPlayer.volume = volume;
            }
        }

        function populateStationSelector() {
            stationSelect.innerHTML = '<option value="">Selecciona una emisora...</option>';
            stations.forEach(station => {
                const option = document.createElement('option');
                option.value = station.id;
                option.textContent = `${station.name} (${station.country})`;
                stationSelect.appendChild(option);
            });
        }

        function setupAudioPlayer() {
            audioPlayer.addEventListener('play', () => {
                isPlaying = true;
                updatePlayButton();
            });
            audioPlayer.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayButton();
            });
            audioPlayer.addEventListener('error', () => {
                showStreamError('❌ Error al reproducir. Intenta otra emisora.');
                isPlaying = false;
                updatePlayButton();
            });
            audioPlayer.addEventListener('canplay', () => {
                hideStreamError();
            });
        }

        function changeStation(stationId) {
            const station = stations.find(s => s.id === stationId);
            if (!station) return;
            audioPlayer.pause();
            currentStation = station;
            currentLogo.src = station.logo;
            currentName.textContent = station.name;
            currentCountry.textContent = station.country;
            stationSelect.value = stationId;
            updateRecentStations(station);
            showNotification(`📻 ${station.name}`);
            audioPlayer.src = station.url;
            audioPlayer.play().catch(e => {
                console.error("Error al reproducir:", e);
                showStreamError('❌ Error al cargar la emisora. URL inválida o sin conexión.');
            });
            updateFavoriteButton();
        }

        function togglePlayPause() {
            if (!currentStation) {
                showStreamError('⚠️ Selecciona una emisora primero');
                return;
            }
            if (isPlaying) {
                audioPlayer.pause();
            } else {
                audioPlayer.play().catch(e => {
                    console.error("Error al reproducir:", e);
                    showStreamError('❌ Error al reproducir. Intenta otra emisora.');
                });
            }
        }

        function updatePlayButton() {
            playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            currentLogo.classList.toggle('playing', isPlaying);
        }

        function previousStation() {
            if (!currentStation) return;
            const currentIndex = stations.findIndex(s => s.id === currentStation.id);
            const previousIndex = currentIndex > 0 ? currentIndex - 1 : stations.length - 1;
            changeStation(stations[previousIndex].id);
        }

        function nextStation() {
            if (!currentStation) return;
            const currentIndex = stations.findIndex(s => s.id === currentStation.id);
            const nextIndex = currentIndex < stations.length - 1 ? currentIndex + 1 : 0;
            changeStation(stations[nextIndex].id);
        }

        function changeVolume(value) {
            volume = parseFloat(value);
            audioPlayer.volume = volume;
            volumeValue.textContent = Math.round(volume * 100) + '%';
            localStorage.setItem('volume', volume.toString());
        }

        function toggleTheme() {
            darkMode = !darkMode;
            updateTheme();
            localStorage.setItem('darkMode', darkMode.toString());
        }

        function updateTheme() {
            document.body.classList.toggle('light-mode', !darkMode);
            document.getElementById('theme-icon').className = darkMode ? 'fas fa-moon' : 'fas fa-sun';
        }

        function toggleFavorite() {
            if (!currentStation) return;
            const stationId = currentStation.id;
            if (favorites.includes(stationId)) {
                favorites = favorites.filter(id => id !== stationId);
                showNotification('❌ Eliminado de favoritos');
            } else {
                favorites.push(stationId);
                showNotification('⭐ Agregado a favoritos');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            updateFavoritesList();
            updateFavoriteButton();
            updateFavoriteCount();
        }

        function updateFavoriteButton() {
            if (!currentStation) return;
            const isFavorite = favorites.includes(currentStation.id);
            favoriteBtn.classList.toggle('active', isFavorite);
            favoriteIcon.className = isFavorite ? 'fas fa-heart' : 'far fa-heart';
        }

        function updateFavoriteCount() {
            favoriteCountEl.textContent = favorites.length;
        }

        function updateFavoritesList() {
            const favoriteStations = stations.filter(s => favorites.includes(s.id));
            if (favoriteStations.length === 0) {
                favoritesList.innerHTML = `
                    <div style="text-align: center; opacity: 0.7; padding: 2rem;">
                        <i class="fas fa-heart" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                        No tienes favoritos aún
                    </div>
                `;
                return;
            }
            favoritesList.innerHTML = favoriteStations.map(station => `
                <div class="station-item" onclick="changeStation('${station.id}')">
                    <img src="${station.logo}" alt="${station.name}">
                    <div class="station-item-info">
                        <div class="station-item-name">${station.name}</div>
                        <div class="station-item-country">${station.country}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateRecentStations(station) {
            recentStations = [station, ...recentStations.filter(s => s.id !== station.id)].slice(0, 5);
            localStorage.setItem('recentStations', JSON.stringify(recentStations));
            updateRecentList();
        }

        function updateRecentList() {
            if (recentStations.length === 0) {
                recentList.innerHTML = `
                    <div style="text-align: center; opacity: 0.7; padding: 2rem;">
                        <i class="fas fa-clock" style="font-size: 2rem; margin-bottom: 1rem; display: block;"></i>
                        No hay emisoras recientes
                    </div>
                `;
                return;
            }
            recentList.innerHTML = recentStations.map(station => `
                <div class="station-item" onclick="changeStation('${station.id}')">
                    <img src="${station.logo}" alt="${station.name}">
                    <div class="station-item-info">
                        <div class="station-item-name">${station.name}</div>
                        <div class="station-item-country">${station.country}</div>
                    </div>
                </div>
            `).join('');
        }

        function shareOnWhatsApp() {
            if (!currentStation) return;
            const text = `🎵 Escuchando ${currentStation.name} en Radio Streaming Pro. ¡Únete! 📻`;
            const url = window.location.href;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(`${text} ${url}`)}`;
            window.open(whatsappUrl, '_blank');
        }

        function requestNotificationPermission() {
            if ('Notification' in window) {
                if (Notification.permission === 'default') {
                    Notification.requestPermission().then(permission => {
                        showNotification(permission === 'granted' ? '🔔 Notificaciones activadas' : '🔕 Notificaciones denegadas');
                    });
                } else {
                    showNotification(Notification.permission === 'granted' ? '🔔 Notificaciones ya están activadas' : '🔕 Notificaciones bloqueadas');
                }
            } else {
                showNotification('❌ Notificaciones no disponibles');
            }
        }

        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }

        // ✅ Mensaje de error dura 8 segundos
        function showStreamError(message) {
            streamErrorText.textContent = message;
            streamError.classList.add('show');
            setTimeout(() => {
                streamError.classList.remove('show');
            }, 8000); // 8 segundos
        }

        function hideStreamError() {
            streamError.classList.remove('show');
        }

        function updateClock() {
            const now = new Date();
            const costaRicaTime = new Date(now.toLocaleString("en-US", {timeZone: "America/Costa_Rica"}));
            const hours = costaRicaTime.getHours();
            const minutes = costaRicaTime.getMinutes();
            const seconds = costaRicaTime.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            const displayHours = hours % 12 || 12;
            clockTime.textContent = `${displayHours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')} ${ampm}`;
            greeting.textContent = hours < 12 ? 'Buenos días' : hours < 18 ? 'Buenas tardes' : 'Buenas noches';
        }

        function updateListenerCount() {
            listenerCount = (Math.floor(Math.random() * 100) + 50) * 10;
            listenerCountEl.textContent = listenerCount.toLocaleString();
        }

        function setupKeyboardControls() {
            document.addEventListener('keydown', (e) => {
                e.preventDefault();

                if (e.key === 'ArrowLeft') {
                    previousStation();
                } else if (e.key === 'ArrowRight') {
                    nextStation();
                } else if (e.key === 'ArrowUp') {
                    window.scrollBy({ top: -80, behavior: 'smooth' });
                } else if (e.key === 'ArrowDown') {
                    window.scrollBy({ top: 80, behavior: 'smooth' });
                } else if (e.key === 'Enter' || e.key === ' ') {
                    togglePlayPause();
                } else if (e.key === 'f' || e.key === 'F') {
                    toggleFavorite();
                } else if (e.key === 'm' || e.key === 'M') {
                    toggleTheme();
                } else if (e.key === 'ArrowUp' && e.ctrlKey) {
                    const newVolume = Math.min(1, volume + 0.1);
                    volumeSlider.value = newVolume;
                    changeVolume(newVolume);
                } else if (e.key === 'ArrowDown' && e.ctrlKey) {
                    const newVolume = Math.max(0, volume - 0.1);
                    volumeSlider.value = newVolume;
                    changeVolume(newVolume);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
